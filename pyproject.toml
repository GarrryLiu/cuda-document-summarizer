[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-document-summarizer"
version = "0.1.0"
requires-python = ">=3.11"
description = "Qwen document summarization and CUDA batching experiments"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.6,<3", "transformers>=4.46,<5", "accelerate>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_summary = ["kernels/*.cu"]
